# Every check a contributor runs locally, run again on a clean machine.
#
# The value is not that these commands pass — they pass on the author's laptop
# by the time a pull request exists. It is that they pass somewhere that has
# never seen the author's laptop: no stale `.mypy_cache`, no editable install
# left over from an experiment, no tool version that happens to be on PATH.
#
# See ADR 0008 for why the checks are one job rather than four, and why every
# action is pinned to a commit rather than a tag. The image is a second job, and
# ADR 0020 says why that is not a contradiction: ADR 0008 objected to jobs each
# paying the same setup cost for one fast command, and this one shares no setup
# with the checks at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository. Nothing here needs a token that can
# write, and a job that cannot write cannot be talked into writing.
permissions:
  contents: read

# A second push to a pull request makes the first run's answer irrelevant.
# Runs on `main` are left alone: each one is the record for a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned for the same reason the dependencies are locked: a uv
          # release should not be able to change what this workflow does
          # without a commit saying so.
          version: "0.12.10"

      # Also the lockfile check. `--locked` fails rather than re-resolving if
      # `uv.lock` and `pyproject.toml` have drifted apart, which is the failure
      # a reviewer cannot see by reading the diff. Python 3.14 is fetched here
      # too, from `.python-version` (ADR 0002).
      - name: Install the locked dependency set
        run: uv sync --locked --all-groups

      # `!cancelled()` on every check after the first: a lint failure must not
      # hide whether the types and tests were also broken. One run should
      # report everything that is wrong, not the first thing.
      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format (ruff format --check)
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: uv run pytest

  # A second job rather than more steps in the first, which is a departure from
  # ADR 0008's "one job rather than four" and deliberate: that reasoning was that
  # four jobs each paying the same setup cost to run one fast command is waste.
  # This job shares none of that setup — no `uv`, no Python, no dependency
  # install — so merging it into `checks` would only make the fast feedback wait
  # for the slow thing. ADR 0020.
  image:
    name: Image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `docker/build-push-action` and no buildx cache. The runner already
      # has Docker, so this needs no action at all, and layer caching is an
      # optimization — `ARCHITECTURE.md` principle 10 says not before
      # measurement. There is nothing to measure until this has run.
      - name: Build the image
        run: docker build --tag devtools-rag-ingestion:ci .

      # `ROADMAP.md` 5.1 says "image builds", and building is the weaker half of
      # what matters: an image can build perfectly and die on the first
      # `docker run` because of the `PATH`, the `CMD`, or the non-root user being
      # unable to read the virtual environment. Those were exactly the claims
      # ADR 0019 could only reason about, so this starts it.
      #
      # `DATABASE_URL` points at nothing on purpose. The composition root opens
      # no connection until a request arrives (ADR 0017), so the server must come
      # up and serve its own OpenAPI document without a database anywhere — which
      # makes this a test of the image rather than of Postgres.
      # No `!cancelled()` here or on the wait, unlike the `checks` job. There
      # that condition is right — those are independent checks and one run should
      # report every failure. These are a *sequence*: running `docker run` after a
      # failed build only produces "Unable to find image", and then polling an
      # address nothing is listening on wasted thirty seconds and buried the real
      # error. Learned from this job's own first run.
      - name: Start the container
        run: |
          docker run --detach --name ingestion \
            --env DATABASE_URL=postgresql://nobody@127.0.0.1:1/nothing \
            --publish 8000:8000 \
            devtools-rag-ingestion:ci

      - name: Wait for it to answer
        run: |
          # Poll rather than sleep a fixed time: a fixed wait is either flaky or
          # slower than it needs to be, and usually both.
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "the container served its OpenAPI document"
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered; its logs follow" >&2
          docker logs ingestion >&2
          exit 1

      # Unconditionally, so a failure above still shows what the container said.
      # This is also the first time anybody sees the image's log output, which
      # ADR 0019 claims is JSON on stdout.
      - name: Show the container's logs
        if: ${{ always() }}
        # Tolerant of there being no container: if the build failed there is
        # nothing to show, and this step must not be what turns the job red.
        run: docker logs ingestion || echo "no container to show logs for"

      - name: Stop the container
        if: ${{ always() }}
        run: docker rm --force ingestion || true

  # A third job, on the rule ADR 0008 now carries: one that would repeat the `uv`
  # setup belongs in `checks`, and this repeats none of it. Separate from `image`
  # rather than appended to it because that job's name is what appears as a status
  # line, and "Image builds and starts" testing the compose stack as well would
  # make the name lie. ADR 0021.
  compose:
    name: Compose starts the stack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `ROADMAP.md` 5.2 is "done when: `docker compose up` works from a clean
      # machine", and a runner is exactly that. `--wait` is the whole reason this
      # is one command: it returns when every service is healthy or has completed,
      # so it *is* the assertion that `postgres` became healthy, `migrate` ran to
      # completion, and `app` started — the ordering that is the only genuinely
      # new mechanism in the file.
      - name: Start the stack
        run: docker compose up --detach --wait

      - name: Post a document through the stack
        run: |
          # Not just a liveness check. The stack's reason to exist is that the
          # schema is there before the app serves a request, so this exercises the
          # path that proves `migrate` actually ran: create a collection, then post
          # a document into it. A 404 or a 500 here means the tables are missing.
          collection=$(curl --silent --fail --show-error \
            --header 'Content-Type: application/json' \
            --data '{"name": "fastapi-docs"}' \
            http://127.0.0.1:8000/collections | python3 -c 'import json,sys; print(json.load(sys.stdin)["collection_id"])')
          echo "created collection $collection"

          content=$(printf 'compose brought the whole stack up.' | base64 --wrap=0)
          curl --silent --fail --show-error --output /dev/null --write-out '%{http_code}\n' \
            --header 'Content-Type: application/json' \
            --data "{\"content\": \"$content\", \"metadata\": {\"source_library\": \"fastapi\", \"doc_type\": \"tutorial\"}}" \
            "http://127.0.0.1:8000/collections/$collection/documents"

      - name: Show what the stack said
        if: ${{ always() }}
        run: docker compose logs || echo "no stack to show logs for"

      # `--volumes`, so the named volume goes too. A runner is thrown away anyway;
      # the flag is here because this is also the command a developer should copy.
      - name: Tear the stack down
        if: ${{ always() }}
        run: docker compose down --volumes || true
