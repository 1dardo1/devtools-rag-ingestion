[project]
name = "devtools-rag-ingestion"
version = "0.1.0"
description = "Document intake service for a RAG system, with a transactional outbox."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
# ADR 0010: psycopg 3 with hand-written SQL; Alembic for migrations.
# Both are runtime rather than dev dependencies: the Phase 5 image has to be
# able to run `alembic upgrade head` against the deployed database, and it
# runs from this same distribution.
# `alembic` pulls SQLAlchemy in transitively. ADR 0010 says why a project that
# declined SQLAlchemy nevertheless installs it, and that nothing here imports
# it.
# ADR 0015: FastAPI for the HTTP layer, which `ROADMAP.md` 4.4 names. Pydantic
# is declared explicitly although `fastapi` already pulls it in, because `api/`
# imports it directly — unlike SQLAlchemy, which ADR 0010 leaves transitive
# precisely because nothing here imports it. Declare what you import.
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[dependency-groups]
# ADR 0011: integration tests start their own containers.
# Only the `postgres` extra for now. The `redis` one arrives with 4.3, which
# is blocked on Phase 3 anyway; installing it early would be a dependency
# nothing uses.
# `httpx2`, not `httpx`. Starlette 1.6 deprecated `httpx` for its `TestClient`
# and asks for `httpx2` by name; the warning was reproduced before choosing.
# See ADR 0015.
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
    "testcontainers[postgres]>=4.15.0",
]

# ADR 0002: Python 3.14.
# ADR 0003: src layout, import root `rag_ingestion`, distribution
#           `devtools-rag-ingestion`.
# ADR 0004: hatchling, deliberately with no [tool.hatch.*] configuration.

[tool.ruff]
target-version = "py314"

# ADR 0006: twenty-three rule families, chosen individually.
[tool.ruff.lint]
select = [
    "A",    # flake8-builtins — shadowed builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear — real defects, not style
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle — docstrings; see ADR 0006 for the two exclusions
    "DTZ",  # flake8-datetimez — naive datetimes reach PostgreSQL
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific
    "S",    # flake8-bandit — security; Phase 13 depends on this being on now
    "SIM",  # flake8-simplify
    "T20",  # flake8-print — a stray print is a data escape
    "TID",  # flake8-tidy-imports — bans relative imports, enforcing ADR 0003
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

# D105: a magic method's contract is defined by Python, not by this codebase.
# D107: every domain exception's `__init__` is one `super().__init__(f"...")`
# line under a class that already carries its own docstring.
ignore = ["D105", "D107"]

# Not optional: without it `D` selects two mutually exclusive pairs
# (D203/D211 and D212/D213) and `ruff` silences one of each with a warning.
[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is pytest's mechanism.
# ARG001/ARG002: fakes implementing a Protocol legitimately ignore parameters
# the port declares, and fixtures are requested for their side effects. See
# ADR 0006 for why renaming the parameter is not an acceptable workaround.
# D: a test's name is already its sentence. Docstrings stay welcome here for
# the ones that need a reason, but are not demanded of all 132.
"tests/**" = ["S101", "ARG001", "ARG002", "D"]

# ADR 0005: strict, over src and tests, with the three gaps closed.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ADR 0011. The unit suite must stay runnable on a machine with no Docker, so
# anything that starts a container is marked and can be excluded with
# `-m "not integration"`. `--strict-markers` turns a typo in a marker name into
# an error rather than a silently unfiltered test.
addopts = "--strict-markers"
markers = [
    "integration: starts a real container; needs a Docker daemon",
]
