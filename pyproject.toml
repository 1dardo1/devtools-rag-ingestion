[project]
name = "devtools-rag-ingestion"
version = "0.1.0"
description = "Document intake service for a RAG system, with a transactional outbox."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]

# ADR 0002: Python 3.14.
# ADR 0003: src layout, import root `rag_ingestion`, distribution
#           `devtools-rag-ingestion`.
# ADR 0004: hatchling, deliberately with no [tool.hatch.*] configuration.

[tool.ruff]
target-version = "py314"

# ADR 0006: twenty-two rule families, chosen individually.
[tool.ruff.lint]
select = [
    "A",    # flake8-builtins — shadowed builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear — real defects, not style
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez — naive datetimes reach PostgreSQL
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific
    "S",    # flake8-bandit — security; Phase 13 depends on this being on now
    "SIM",  # flake8-simplify
    "T20",  # flake8-print — a stray print is a data escape
    "TID",  # flake8-tidy-imports — bans relative imports, enforcing ADR 0003
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is pytest's mechanism.
# ARG001/ARG002: fakes implementing a Protocol legitimately ignore parameters
# the port declares, and fixtures are requested for their side effects. See
# ADR 0006 for why renaming the parameter is not an acceptable workaround.
"tests/**" = ["S101", "ARG001", "ARG002"]

# ADR 0005: strict, over src and tests, with the three gaps closed.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
