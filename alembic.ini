# Alembic's configuration. ADR 0010 chose Alembic running hand-written SQL;
# ADR 0012 records the schema those migrations create.

[alembic]
# `package:path` rather than a filesystem path, so `alembic upgrade head`
# resolves the migrations from the installed distribution as readily as from a
# checkout. The Phase 5 image runs it from site-packages, where `src/` does not
# exist.
script_location = rag_ingestion:migrations

# `v` prefix so that every generated filename is a valid Python identifier.
# Without it a revision id beginning with a digit produces a module name that
# `mypy` refuses to import, and ADR 0005 puts `mypy --strict` over all of
# `src`.
file_template = v%%(rev)s_%%(slug)s

# Deliberately empty. The URL is supplied by the environment, or set on this
# config object by a caller that already knows it. ADR 0012 says why it is not
# written here.
sqlalchemy.url =

# Alembic's own console output, and nothing else. The service's logging and
# error reporting is a decision still due before 4.5, recorded as an open item
# in `docs/BUILD-PLAN.md`; this does not pre-empt it.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
